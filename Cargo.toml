[package]
name = "limitdeck"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "A privacy-safe terminal dashboard for AI subscription limits"
license = "MIT"
repository = "https://github.com/rockythink/limitdeck"
homepage = "https://github.com/rockythink/limitdeck"
readme = "README.md"
keywords = ["tui", "codex", "claude", "rate-limit", "ratatui"]
categories = ["command-line-utilities"]
exclude = ["PROJECT_BRIEF.md"]

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
